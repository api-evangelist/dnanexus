- name: DNAnexus OpenID Connect Provider
  description: 'DNAnexus operates an OpenID Connect provider that lets third-party web
    applications sign users in with their DNAnexus Platform credentials. The provider
    publishes an OIDC discovery document at https://oidc.dnanexus.com/.well-known/openid-configuration,
    supports the authorization_code grant with PKCE (S256), and issues ID tokens carrying
    sub, name, email, user_id, sid, auth_time and iss claims. OIDC clients are registered
    and managed through the Platform API oidcClient methods.'
  humanURL: https://documentation.dnanexus.com/developer/api/oidc-clients
  baseURL: https://oidc.dnanexus.com
