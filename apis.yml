apis:
- name: DNAnexus Platform API
  description: 'The DNAnexus Platform API is a JSON-over-HTTPS API of roughly 206 documented
    methods. Each method is invoked with an HTTP POST to a route of the form /class-xxxx/method
    (for example /file-xxxx/describe) or /system/method (for example /system/findDataObjects),
    with a JSON request body and a JSON response body. Method families cover data containers
    and projects, data objects (files, records, databases, drives, dbclusters), data-object
    metadata, apps, applets, workflows, global workflows, jobs, analyses and execution
    containers, search, organizations, users, OIDC clients, the Omics Data Catalog, and
    Trusted Research Environments.'
  humanURL: https://documentation.dnanexus.com/developer/api
