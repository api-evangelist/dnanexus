aid: dnanexus
name: DNAnexus
description: 'DNAnexus operates a cloud-based precision health data platform for genomic
  and multi-omic research, clinical testing and biopharma R&D. The DNAnexus Platform
  exposes a documented HTTP API of roughly 206 JSON-over-HTTPS methods at api.dnanexus.com
  covering projects and data containers, files and other data objects, apps, applets,
  workflows and analyses, jobs and execution containers, organizations and users, the
  Omics Data Catalog, and Trusted Research Environments (TREs) with data access requests.
  Every call is an HTTP POST with a JSON body, authenticated with a bearer token, versioned
  through an optional DNAnexus-API header, and made idempotent through a documented nonce
  field on object- and job-creation methods. First-party client libraries ship for Python
  (dxpy), Java, Scala and C++, alongside the dx command-line client, dxfuse and dxda,
  and the platform is an OpenID Connect provider for third-party sign-in and for job
  identity tokens.'
