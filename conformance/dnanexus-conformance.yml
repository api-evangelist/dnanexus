    /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc on
    api.dnanexus.com (404 on every path), documentation.dnanexus.com (404) and
    www.dnanexus.com (404). platform.dnanexus.com answers 200 for every path but
