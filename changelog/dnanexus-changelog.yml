  tags: [new-release, improvements, fixes]
  highlights:
  - Omics Data Assistant renamed to Omics Data Agent (ODA acronym unchanged).
  - 'dx-toolkit v412.0: Nextflow workflows recover from temporary upload errors instead
    of hanging.'
  fixes:
  - Cohort Browser numeric EQUALS ANY OF / NOT EQUALS filters no longer discard a value
    unless Enter is pressed.
