  date: '2026-07-28'
  tags: [new-release, improvements, fixes]
  highlights:
  - TREs can distribute file-only or tabular-only data without a Data Showcase; Data
    Showcase and Tabular Data Inventory are now optional at TRE setup.
  - Omics Data Catalog copies can preserve original folder structure.
  - TRE working project and robot user protected from accidental deletion.
  - 'dx-toolkit v411.0: support for Nextflow module binaries.'
